<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCard {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
      50% { transform: translateY(-4px); filter: drop-shadow(0 10px 15px rgba(59,130,246,0.4)); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanBeam {
      0% { transform: translateX(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateX(80px); opacity: 0.2; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .flow-path {
      stroke: #60a5fa;
      stroke-width: 2.5;
      stroke-dasharray: 6 6;
      animation: flowLine 1.5s linear infinite;
    }
    .card-1 { animation: pulseCard 3s ease-in-out infinite; animation-delay: 0s; }
    .card-2 { animation: pulseCard 3s ease-in-out infinite; animation-delay: 0.5s; }
    .card-3 { animation: pulseCard 3s ease-in-out infinite; animation-delay: 1.0s; }
    .card-4 { animation: pulseCard 3s ease-in-out infinite; animation-delay: 1.5s; }
    .card-5 { animation: pulseCard 3s ease-in-out infinite; animation-delay: 2.0s; }
    .card-6 { animation: pulseCard 3s ease-in-out infinite; animation-delay: 2.5s; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="320" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="878" height="318" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Banner -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="28" height="28" rx="7" fill="url(#blueGrad)" />
    <text x="14" y="18" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle">S</text>
    <text x="38" y="15" fill="#f8fafc" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="15">S-TM 平台 6 步全自动分析流程动态图</text>
    <text x="38" y="27" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-weight="500" font-size="10.5">S-TM Arginine Fluorescence Assay &amp; Chiral Resolution Pipeline</text>
  </g>

  <!-- Pipeline Connecting Animated Flow Lines -->
  <!-- Line 1 to 2 -->
  <path d="M 148, 170 L 175, 170" class="flow-path" />
  <!-- Line 2 to 3 -->
  <path d="M 293, 170 L 320, 170" class="flow-path" />
  <!-- Line 3 to 4 -->
  <path d="M 438, 170 L 465, 170" class="flow-path" />
  <!-- Line 4 to 5 -->
  <path d="M 583, 170 L 610, 170" class="flow-path" />
  <!-- Line 5 to 6 -->
  <path d="M 728, 170 L 755, 170" class="flow-path" />

  <!-- STEP 1 CARD -->
  <g transform="translate(30, 85)" class="card-1">
    <rect width="118" height="175" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="22" r="11" fill="#3b82f6" />
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <text x="36" y="24" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold">下载模板</text>
    <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Download XLSX</text>
    <!-- Card Graphic: Excel Sheet -->
    <rect x="14" y="52" width="90" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <rect x="20" y="60" width="78" height="6" rx="2" fill="#10b981" />
    <line x1="20" y1="74" x2="98" y2="74" stroke="#334155" stroke-width="1" />
    <line x1="20" y1="84" x2="98" y2="84" stroke="#334155" stroke-width="1" />
    <line x1="20" y1="94" x2="98" y2="94" stroke="#334155" stroke-width="1" />
    <line x1="20" y1="104" x2="98" y2="104" stroke="#334155" stroke-width="1" />
    <text x="59" y="114" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">14 标准列</text>
    <text x="59" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">含波长与标样通道</text>
    <text x="59" y="153" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Auto Structure</text>
  </g>

  <!-- STEP 2 CARD -->
  <g transform="translate(175, 85)" class="card-2">
    <rect width="118" height="175" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="20" cy="22" r="11" fill="#0ea5e9" />
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <text x="36" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">上传校验</text>
    <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Drag &amp; Parse</text>
    <!-- Card Graphic: Upload Check -->
    <rect x="14" y="52" width="90" height="70" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <path d="M 59,62 L 59,82 M 52,70 L 59,62 L 66,70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="59" cy="98" r="8" fill="#10b981" />
    <path d="M 55,98 L 58,101 L 63,95" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="59" y="115" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">100% 本地校验</text>
    <text x="59" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">121 个发射光谱点</text>
    <text x="59" y="153" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Zero Leakage</text>
  </g>

  <!-- STEP 3 CARD -->
  <g transform="translate(320, 85)" class="card-3">
    <rect width="118" height="175" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="20" cy="22" r="11" fill="#f43f5e" />
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    <text x="36" y="24" fill="#fb7185" font-family="sans-serif" font-size="11" font-weight="bold">自动寻峰</text>
    <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Auto λmax</text>
    <!-- Card Graphic: Spectrum Wave with red peak line -->
    <rect x="14" y="52" width="90" height="70" rx="6" fill="#0f172a" stroke="#e11d48" stroke-width="1" />
    <path d="M 18,105 Q 40,103 48,90 T 59,65 T 70,90 T 100,105" fill="none" stroke="#60a5fa" stroke-width="1.8" />
    <line x1="59" y1="56" x2="59" y2="114" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="2,2" />
    <circle cx="59" cy="65" r="3" fill="#ef4444" />
    <rect x="42" y="54" width="34" height="10" rx="3" fill="#ef4444" />
    <text x="59" y="62" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">486 nm</text>
    <text x="59" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">提取 13 路发射强度</text>
    <text x="59" y="153" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Peak Extracted</text>
  </g>

  <!-- STEP 4 CARD -->
  <g transform="translate(465, 85)" class="card-4">
    <rect width="118" height="175" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="22" r="11" fill="#3b82f6" />
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4</text>
    <text x="36" y="24" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold">总Arg定量</text>
    <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Total Arg Fit</text>
    <!-- Card Graphic: Linear Calibration -->
    <rect x="14" y="52" width="90" height="70" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1" />
    <line x1="22" y1="108" x2="96" y2="65" stroke="#3b82f6" stroke-width="2" />
    <circle cx="36" cy="100" r="2.5" fill="#93c5fd" />
    <circle cx="58" cy="87" r="2.5" fill="#93c5fd" />
    <circle cx="80" cy="74" r="2.5" fill="#93c5fd" />
    <polygon points="69,76 73,80 69,84 65,80" fill="#ef4444" />
    <text x="59" y="63" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle">R²=0.9999</text>
    <text x="59" y="114" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">C_total = 24.03 μM</text>
    <text x="59" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">S-TM 相对响应拟合</text>
    <text x="59" y="153" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">ΔF/F₀ Formulation</text>
  </g>

  <!-- STEP 5 CARD -->
  <g transform="translate(610, 85)" class="card-5">
    <rect width="118" height="175" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="20" cy="22" r="11" fill="#a855f7" />
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5</text>
    <text x="36" y="24" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">手性拆分</text>
    <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">L/D Solving</text>
    <!-- Card Graphic: Dual Curves L & D -->
    <rect x="14" y="52" width="90" height="70" rx="6" fill="#0f172a" stroke="#7e22ce" stroke-width="1" />
    <line x1="22" y1="108" x2="96" y2="60" stroke="#a855f7" stroke-width="2" />
    <line x1="22" y1="108" x2="96" y2="84" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />
    <text x="25" y="65" fill="#c084fc" font-family="sans-serif" font-size="7.5" font-weight="bold">L-Arg</text>
    <text x="25" y="75" fill="#fbbf24" font-family="sans-serif" font-size="7.5" font-weight="bold">D-Arg</text>
    <text x="59" y="105" fill="#e879f9" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">区分度 2.68×</text>
    <text x="59" y="115" fill="#34d399" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">联立求解 CL / CD</text>
    <text x="59" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">光学线性叠加模型</text>
    <text x="59" y="153" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Al³⁺ Coordinated</text>
  </g>

  <!-- STEP 6 CARD -->
  <g transform="translate(755, 85)" class="card-6">
    <rect width="118" height="175" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="22" r="11" fill="#10b981" />
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">6</text>
    <text x="36" y="24" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">大屏与导出</text>
    <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Dashboard</text>
    <!-- Card Graphic: Donut Chart -->
    <rect x="14" y="52" width="90" height="70" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1" />
    <circle cx="59" cy="85" r="20" fill="none" stroke="#f59e0b" stroke-width="6" />
    <circle cx="59" cy="85" r="20" fill="none" stroke="#7c3aed" stroke-width="6" stroke-dasharray="94 125" stroke-dashoffset="0" transform="rotate(-90 59 85)" />
    <text x="59" y="87" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">50%</text>
    <text x="59" y="96" fill="#cbd5e1" font-family="sans-serif" font-size="6" text-anchor="middle">ee (L)</text>
    <rect x="22" y="106" width="74" height="12" rx="3" fill="#10b981" />
    <text x="59" y="115" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">导出 6-Sheet 报告</text>
    <text x="59" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">L: 75% | D: 25%</text>
    <text x="59" y="153" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Excel + 300DPI 图</text>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(30, 278)">
    <rect x="0" y="0" width="820" height="28" rx="6" fill="#1e293b" opacity="0.8" />
    <circle cx="20" cy="14" r="4" fill="#3b82f6" />
    <text x="30" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10">总精氨酸体系 (S-TM)</text>
    <circle cx="160" cy="14" r="4" fill="#a855f7" />
    <text x="170" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10">手性识别体系 (S-TM + Al³⁺)</text>
    <circle cx="330" cy="14" r="4" fill="#f43f5e" />
    <text x="340" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10">智能特征波长提取 (486 nm)</text>
    <circle cx="510" cy="14" r="4" fill="#10b981" />
    <text x="520" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10">纯前端离线安全计算 (100% Local Browser)</text>
    <text x="805" y="17" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="end">v1.2.0</text>
  </g>
</svg>
